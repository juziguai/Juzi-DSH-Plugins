name: Verify plugins and market
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r plugins/dsh-deepseek-tools/requirements.txt
      - run: npm test
      - name: Install official market validator in temporary tools directory
        run: npm install --prefix "$RUNNER_TEMP/market-validator" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.2
      - name: Validate market against pinned source
        run: |
          export DSH_MARKET_INDEX_MODULE="$RUNNER_TEMP/market-validator/node_modules/@deepseek-ai/dsh-plugin-market-index/lib/index.js"
          npm run market:check
      - run: git diff --check
